<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account</title>

  <link rel="stylesheet" href="../styles.css">

</head>

<body class="auth-body">

  <div class="auth-card">

    <img
      src="../assets/logo.png"
      class="auth-logo"
    >

    <h1>Create Account</h1>

    <input
      type="text"
      placeholder="Username"
    >

    <input
      type="email"
      placeholder="Email"
    >

    <input
      type="password"
      placeholder="Password"
    >

    <input
      type="text"
      placeholder="Access Key"
    >

    <button class="primary-btn auth-btn">
      Create Account
    </button>

  </div>

</body>
</html>
