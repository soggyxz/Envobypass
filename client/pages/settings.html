<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Settings</title>

  <link
    rel="stylesheet"
    href="../styles.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-header">

      <img
        src="../assets/logo.png"
        class="logo"
      >

      <div>

        <h2>EnvoBypass</h2>

        <p class="sidebar-subtitle">
          Modern Platform
        </p>

      </div>

    </div>

    <div class="sidebar-links">

      <a href="../index.html">
        Bypass
      </a>

      <a
        href="settings.html"
        class="active"
      >
        Settings
      </a>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <div class="settings-title-wrap">

      <h1>
        Settings
      </h1>

      <p>
        Customize your experience
      </p>

    </div>

    <!-- SETTINGS GRID -->

    <section class="settings-grid">

      <!-- APPEARANCE -->

      <div class="settings-card">

        <h3>
          Appearance
        </h3>

        <label>
          Theme Accent
        </label>

        <input
          type="color"
          value="#8b5cf6"
        >

        <label>
          Username
        </label>

        <input
          type="text"
          placeholder="Enter username"
        >

      </div>

      <!-- WEBHOOKS -->

      <div class="settings-card">

        <div class="coming-soon">
          COMING SOON
        </div>

        <h3>
          Discord Webhooks
        </h3>

        <p>

          Discord webhook integrations
          are currently in development.

        </p>

        <input
          type="text"
          placeholder="Webhook URL"
          disabled
        >

        <button disabled>
          Save Webhook
        </button>

      </div>

    </section>

  </main>

</body>
</html>
