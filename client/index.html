<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>EnvoBypass</title>

  <link rel="stylesheet" href="styles.css">

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="sidebar-header">

      <img
        src="assets/logo.png"
        class="logo"
      >

      <h2>EnvoBypass</h2>

    </div>

    <div class="sidebar-links">

      <a class="active">
        Bypass
      </a>

      <a href="pages/settings.html">
        Settings
      </a>

    </div>

  </aside>

  <!-- MAIN -->

  <main class="main">

    <!-- TOP BAR -->

    <div class="topbar">

      <div class="topbar-left">

        <h1>
          Bypass Dashboard
        </h1>

        <p>
          Modern URL tools platform
        </p>

      </div>

      <div class="status-online">

        <div class="dot"></div>

        Online

      </div>

    </div>

    <!-- MAIN CARD -->

    <section class="main-card">

      <div class="card-glow"></div>

      <h2>
        Paste URL
      </h2>

      <p>
        Enter your URL below
      </p>

      <div class="url-box">

        <input
          type="text"
          placeholder="https://example.com"
        >

        <button>
          Analyze
        </button>

      </div>

    </section>

    <!-- INFO CARDS -->

    <section class="info-grid">

      <div class="info-card">

        <h3>Fast Infrastructure</h3>

        <p>
          Optimized modern backend.
        </p>

      </div>

      <div class="info-card">

        <h3>Secure Platform</h3>

        <p>
          Premium protected systems.
        </p>

      </div>

      <div class="info-card webhook-card">

        <div class="coming-soon">
          COMING SOON
        </div>

        <h3>Discord Webhooks</h3>

        <p>
          Bot integrations and webhook
          support arriving soon.
        </p>

      </div>

    </section>

  </main>

</body>
</html>
